name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Linux CI has no X11 or Wayland display, so the clipboard crate cannot
      # be exercised there. Everything else is.
      - name: Test
        run: cargo test --all-targets

      # The build a user gets with --no-default-features: no image parsing, no
      # networking, no clipboard. It must keep compiling and passing.
      - name: Test the minimal build
        run: cargo test --all-targets --no-default-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo clippy --all-targets --no-default-features

  # cargo-audit is run directly rather than through rustsec/audit-check: that
  # action reports by creating a check run, which needs `checks: write` on the
  # workflow token and fails the job outright when the repository does not
  # grant it. Running the tool prints the same findings and needs no token.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      # --deny warnings also fails on unmaintained and unsound advisories, not
      # just on vulnerabilities. The tree is clean of all three today, and this
      # is what keeps it that way.
      - run: cargo audit --deny warnings
